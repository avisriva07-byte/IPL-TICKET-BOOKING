<!DOCTYPE html>
<html>

<head>
    <title>IPL Ticket Booking</title>
    <meta charset="UTF-8">
</head>

<body>

    <header>
        <h1>IPL 2026 Ticket Booking</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="index.html#matches">Matches</a> |
            <a href="booking.html">Book Ticket</a> |
            <a href="index.html#guidelines">Guidelines</a>
        </nav>
    </header>

    <hr>

    <main>

        <h2>Book Your IPL Ticket</h2>

        <form action="#" method="post">

            <!-- Name -->
            <label for="name">Name:</label><br>
            <input type="text"
                   id="name"
                   name="name"
                   minlength="3"
                   maxlength="30"
                   required
                   placeholder="Enter your name">

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label><br>
            <input type="email"
                   id="email"
                   name="email"
                   required
                   placeholder="Enter your email">

            <br><br>

            <!-- Phone -->
            <label for="phone">Phone Number:</label><br>
            <input type="tel"
                   id="phone"
                   name="phone"
                   minlength="10"
                   maxlength="10"
                   required
                   placeholder="Enter 10 digit number">

            <br><br>

            <!-- Match -->
            <label for="match">Select Match:</label><br>
            <select id="match" name="match" required>

                <option value="">-- Select Match --</option>
                <option value="rcb-csk">RCB vs CSK</option>
                <option value="mi-kkr">MI vs KKR</option>
                <option value="csk-srh">CSK vs SRH</option>

            </select>

            <br><br>

            <!-- Stand -->
            <label>Stand Category:</label><br>

            <input type="radio"
                   id="general"
                   name="stand"
                   value="General"
                   required>

            <label for="general">General - ₹1000</label>

            <br>

            <input type="radio"
                   id="premium"
                   name="stand"
                   value="Premium">

            <label for="premium">Premium - ₹2500</label>

            <br>

            <input type="radio"
                   id="vip"
                   name="stand"
                   value="VIP">

            <label for="vip">VIP - ₹5000</label>

            <br><br>

            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label><br>

            <input type="number"
                   id="tickets"
                   name="tickets"
                   min="1"
                   max="6"
                   required>

            <br><br>

            <!-- Additional preference -->
            <label>
                <input type="checkbox" name="terms" required>
                I agree to the ticket booking terms and conditions.
            </label>

            <br><br>

            <!-- Buttons -->
            <input type="submit" value="Book Ticket">
            <input type="reset" value="Reset">

        </form>

    </main>

    <hr>

    <footer>
        <p>© 2026 IPL Ticket Booking</p>
    </footer>

</body>

</html>
